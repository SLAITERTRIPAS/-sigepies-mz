    <meta property="og:title" content="SIGEP - Plataforma Inteligente de Gestão Estratégica e Projeção Académica" />
    <meta property="og:description" content="SIGEP - Plataforma Inteligente de Gestão Estratégica e Projeção Académica. SIGEP - Moçambique V1.1.2.0 SISTEMA INTEGRADO DE GESTÃO DE PROCESSOS © 2026" />

    <script>
      (function() {
        function isIgnorableError(err) {
          if (!err) return false;
          var str = "";
          try {
            str = (err.message || err.reason || err.stack || String(err) || "").toLowerCase();
          } catch(e) {
            str = "";
          }
          var isIgnorable = (
            str.indexOf("internal assertion failed") !== -1 ||
            str.indexOf("unexpected state") !== -1 ||
            str.indexOf("quota limit exceeded") !== -1 ||
            str.indexOf("free daily read units") !== -1 ||
            str.indexOf("resource-exhausted") !== -1 ||
            str.indexOf("resource_exhausted") !== -1 ||
            str.indexOf("could not reach cloud firestore") !== -1 ||
            str.indexOf("backend didn't respond") !== -1 ||
            str.indexOf("client will operate in offline mode") !== -1 ||
            str.indexOf("@firebase/firestore") !== -1 ||
            str.indexOf("firestore (11.") !== -1
          );
          if (isIgnorable) {
            console.warn("Ignored systemic error:", str);
          }
          return isIgnorable;
        }

        window.addEventListener("error", function(e) {
          if (isIgnorableError(e.error) || isIgnorableError(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          if (isIgnorableError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isIgnorableError(msg) || isIgnorableError(err)) {
            return true;
          }
          if (typeof origOnError === "function") {
            return origOnError.apply(this, arguments);
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
